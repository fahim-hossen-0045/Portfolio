<svg viewBox="0 0 320 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bugGlow" cx="50%" cy="40%" r="65%">
      <stop offset="0" stop-color="#16302c"/>
      <stop offset="1" stop-color="#0d1a18"/>
    </radialGradient>
  </defs>
  <circle cx="160" cy="160" r="150" fill="url(#bugGlow)" stroke="#e8a33d" stroke-width="2" stroke-dasharray="6 10"/>

  <!-- bug body -->
  <g transform="translate(160,175)">
    <ellipse cx="0" cy="0" rx="42" ry="58" fill="#1c3834" stroke="#4fd1b8" stroke-width="3"/>
    <line x1="0" y1="-58" x2="0" y2="58" stroke="#4fd1b8" stroke-width="2" opacity=".5"/>
    <line x1="-42" y1="-10" x2="42" y2="-10" stroke="#4fd1b8" stroke-width="2" opacity=".5"/>
    <line x1="-42" y1="18" x2="42" y2="18" stroke="#4fd1b8" stroke-width="2" opacity=".5"/>
    <circle cx="0" cy="-70" r="16" fill="#1c3834" stroke="#4fd1b8" stroke-width="3"/>
    <!-- antennae -->
    <line x1="-6" y1="-84" x2="-20" y2="-104" stroke="#e8a33d" stroke-width="3" stroke-linecap="round"/>
    <line x1="6" y1="-84" x2="20" y2="-104" stroke="#e8a33d" stroke-width="3" stroke-linecap="round"/>
    <!-- legs -->
    <g stroke="#e8a33d" stroke-width="4" stroke-linecap="round">
      <line x1="-40" y1="-30" x2="-72" y2="-42"/>
      <line x1="-44" y1="0" x2="-80" y2="0"/>
      <line x1="-40" y1="30" x2="-72" y2="42"/>
      <line x1="40" y1="-30" x2="72" y2="-42"/>
      <line x1="44" y1="0" x2="80" y2="0"/>
      <line x1="40" y1="30" x2="72" y2="42"/>
    </g>
  </g>

  <!-- magnifying glass inspecting the bug -->
  <g transform="translate(215,95)">
    <circle r="34" fill="rgba(232,163,61,0.08)" stroke="#e8a33d" stroke-width="5"/>
    <line x1="24" y1="24" x2="52" y2="52" stroke="#e8a33d" stroke-width="7" stroke-linecap="round"/>
    <path d="M-14 4 L-4 14 L16 -10" fill="none" stroke="#eef1ea" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
